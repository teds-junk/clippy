# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

infra:
    provider: microsoft.foundry
name: clippy
metadata:
    template: clippy@0.1.0
services:
    ai-project:
        deployments:
            - model:
                format: OpenAI
                name: gpt-5-mini
                version: "2025-08-07"
              name: gpt-5-mini
              sku:
                capacity: 100
                name: GlobalStandard
        host: azure.ai.project
    clippy:
        $ref: ./agents/clippy.yaml
        host: azure.ai.agent
        project: .
        uses:
            - ai-project
